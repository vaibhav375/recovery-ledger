[project]
name = "recovery-ledger"
version = "0.1.0"
description = "Autonomous revenue-recovery agent for Indian payments — incremental recovery, measured against a randomised no-contact holdout, gated by a deterministic compliance kernel."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "econml>=0.15",
    "scikit-uplift>=0.5.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "click>=8.1",
    "rich>=13.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
